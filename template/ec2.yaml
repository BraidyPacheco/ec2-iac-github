AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con HTTP visible en navegador

Resources:

  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-08a6efd148b1f7504
      InstanceType: t3.micro

      SecurityGroups:
        - !Ref MySecurityGroup

      UserData:
       Fn::Base64: |
        #!/bin/bash
        apt update -y
        apt install -y apache2
        systemctl enable apache2
        systemctl start apache2
        echo "<h1>FUNCIONA EN EL NAVEGADOR 🚀</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: EC2-GitHubActions

  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir HTTP y SSH

      SecurityGroupIngress:

        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        # HTTP (WEB)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  PublicIP:
    Value: !GetAtt MyEC2.PublicIp